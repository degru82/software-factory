services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/software-factory:cached
    command: sleep infinity
    environment:
      # 호스트(macOS)의 .venv와 섞이지 않도록 컨테이너 전용 위치에 가상환경을 둔다
      UV_PROJECT_ENVIRONMENT: /home/vscode/.venv
      UV_LINK_MODE: copy
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-devpassword}
    depends_on:
      neo4j:
        condition: service_healthy

  neo4j:
    image: neo4j:5-community
    environment:
      # 로컬 개발 전용 기본값. 실제 비밀번호는 호스트 환경변수 NEO4J_PASSWORD로 덮어쓴다
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-devpassword}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  neo4j-data:

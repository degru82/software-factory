[project]
name = "factory-app"
version = "0.1.0"
description = "NHTSA 파워트레인 결함 그래프 검색 + 장애보고서·조치계획 초안 에이전트"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "streamlit>=1.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=factory_app --cov-report=term-missing"
markers = [
    "integration: Neo4j 등 외부 서비스가 필요한 테스트",
]

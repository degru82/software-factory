# 커밋 전 시크릿 검사 (Action Plan Phase 3.3, #20).
# CI(gitleaks.yml, #21)와 같은 .gitleaks.toml을 쓴다. gitleaks는 리포 루트의 .gitleaks.toml을 자동으로 읽는다.
# 설치: uv sync && uv run pre-commit install   (Codespaces는 postCreateCommand가 자동으로 한다)
# 갱신: uv run pre-commit autoupdate 후 PR로. rev는 태그로만 고정한다(tests/test_secret_gate.py가 검사).
# gitleaks 외 Hook은 두지 않는다(#20 D3): 커밋이 느려지면 --no-verify 습관이 생겨 시크릿 검사까지 꺼진다.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
